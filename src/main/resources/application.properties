spring.application.name=collab-docs

# Yjs collaboration service URL (Node.js microservice)
app.yjs.service-url=${YJS_SERVICE_URL:http://localhost:3000}

# Shared secret the yjs-service presents (X-Internal-Service-Key header) to call
# the yjs-snapshot save/load endpoints, which sit behind normal auth otherwise.
app.internal.service-key=${INTERNAL_SERVICE_KEY}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==== JPA / Hibernate ====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ==== Connection Pooling (HikariCP default) ====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:900000}
# Refresh token lifetime (server-tracked, opaque — see RefreshTokenService). Default 30 days.
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
frontend.url=${FRONTEND_URL:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html

spring.task.scheduling.enabled=true
app.name=Collab Docs

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# OTP Configuration
app.otp.expiry.minutes=${OTP_EXPIRY_MINUTES:10}
app.otp.max.attempts=${OTP_MAX_ATTEMPTS:3}
app.otp.block.minutes=${OTP_BLOCK_MINUTES:30}
app.otp.max.requests.per.hour=${OTP_MAX_REQUESTS_PER_HOUR:5}

#Redis Configuration
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.database=${REDIS_DATABASE}

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Versioning Configuration
app.version.max-versions-per-document=${MAX_VERSIONS_PER_DOCUMENT:100}

# Recycle Bin — days a soft-deleted document is kept before permanent auto-purge
app.recycle-bin.retention-days=${RECYCLE_BIN_RETENTION_DAYS:15}

# Sharing Configuration
app.share.default-expiry-days=${SHARE_DEFAULT_EXPIRY_DAYS:7}
app.share.invitation-expiry-days=${SHARE_INVITATION_EXPIRY_DAYS:7}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

